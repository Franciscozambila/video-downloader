<!DOCTYPE html>
<html lang="pt-AO" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}{{ title|default('StreamDownload') }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}">
</head>
<body>
  <header class="header">
    <div class="container header-content">
      <a href="/" class="brand">
        <img src="{{ url_for('static', path='logo-mark.png') }}" alt="StreamDownload Logo">
        <span>StreamDownload</span>
      </a>
      <ul class="nav-menu">
        <li><a href="/" class="nav-link active">Início</a></li>
        <li><a href="/search" class="nav-link">Explorar</a></li>
        <li><a href="/#download" class="nav-link">Downloads</a></li>
        <li><a href="/sobre" class="nav-link">Sobre</a></li>
      </ul>
      <div class="header-actions">
        <form action="/search" method="GET" class="header-search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
          <input type="text" name="q" placeholder="Pesquisar mídia..." aria-label="Pesquisar mídia">
        </form>
        <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Alternar tema">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9 9-4.03 9-9c0-.46-.04-.92-.1-1.36-.98 1.37-2.58 2.26-4.4 2.26-2.98 0-5.4-2.42-5.4-5.4 0-1.81.89-3.42 2.26-4.4C12.92 3.04 12.46 3 12 3z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <nav class="mobile-nav" aria-label="Navegação móvel">
    <a href="/" class="mobile-nav-item active"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg><span>Início</span></a>
    <a href="/search" class="mobile-nav-item"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg><span>Explorar</span></a>
    <a href="/#download" class="mobile-nav-item"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg><span>Downloads</span></a>
    <a href="/sobre" class="mobile-nav-item"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg><span>Sobre</span></a>
  </nav>

  <script src="{{ url_for('static', path='js/main.js') }}"></script>
</body>
</html>
